<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>超音速スモウバトル～ちゃんこ食わんかい～</title>
    <meta name="description" content="1プレイ3分で爽快絶頂！ボタンを押した瞬間気持ちいい！360°ぶっ飛ばし超音速スモウアクション！">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@900&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <!-- 爆速・極小シンプルヘッダー -->
        <header class="game-header">
            <div class="header-main-info">
                <h1 class="logo">
                    <span class="logo-main">超音速スモウバトル <span class="highlight">～ちゃんこ食わんかい～</span></span>
                </h1>
                <div class="header-badges">
                    <div class="badge badge-level" id="level-badge">勝数: 0 破竹の連勝中！</div>
                    <button id="btn-top-nav" class="btn-icon-top" type="button">🏠 TOP</button>
                </div>
            </div>

            <!-- 超直感進行ゲージ -->
            <div class="rank-map-container">
                <div class="rank-step active" id="rmap-0">🐰<small>超高速</small></div>
                <div class="rank-line"></div>
                <div class="rank-step" id="rmap-1">🐻<small>超重量</small></div>
                <div class="rank-line"></div>
                <div class="rank-step" id="rmap-2">🐱<small>影分身</small></div>
                <div class="rank-line"></div>
                <div class="rank-step" id="rmap-3">🦅<small>塩乱射</small></div>
                <div class="rank-line"></div>
                <div class="rank-step" id="rmap-4">🐲<small>双子ボス</small></div>
            </div>
        </header>

        <!-- メインゲームエリア -->
        <main class="game-viewport">
            <div id="speed-lines" class="speed-lines" aria-hidden="true"></div>

            <div id="burst-cutin" class="burst-cutin hidden">
                <div class="cutin-text">🔥 超 ど す こ い 🔥</div>
            </div>

            <div id="event-banner" class="event-banner hidden">
                <span id="event-title">🎲 破天荒ハプニング！</span>
            </div>

            <canvas id="sumo-canvas" width="900" height="520" aria-label="相撲ゲーム画面"></canvas>

            <div id="ui-overlay" class="overlay active">
                
                <!-- 1. 爆速タイトル画面 (ボタン1つで即開幕！) -->
                <section id="screen-title" class="screen-panel active">
                    <div class="title-banner">
                        <span class="pop-sticker">💥 爽快絶頂！1プレイ3分のぶっ飛ばしバトル 💥</span>
                        <h2 class="title-huge">超音速スモウバトル</h2>
                        <p class="subtitle">～ちゃんこ食わんかい～</p>
                    </div>

                    <div class="quick-start-box">
                        <button id="btn-start-arcade" class="btn btn-arcade btn-mega-start" type="button">
                            <span class="btn-emoji">🔥</span>
                            <span class="btn-title">今すぐ勝負開始！ [Enter]</span>
                        </button>
                    </div>

                    <div class="super-simple-rules">
                        <span>🕹️ 移動: WASD / 矢印 / タッチ</span>
                        <span>💥 押す: Space</span>
                        <span>✨ パリィ: J</span>
                    </div>
                </section>

                <!-- 2. 1秒直感スキル選択画面 (試合間に爆速ポップアップ！) -->
                <section id="screen-skill-select" class="screen-panel hidden">
                    <div class="skill-select-header">
                        <span class="pop-badge">💥 強化ちゃんこ獲得！ 💥</span>
                        <h2>1秒でカードを選べ！ [A/D ➔ Enter]</h2>
                    </div>
                    <div id="cards-container" class="cards-container"></div>
                </section>

                <!-- 3. 短く熱い決着リザルト画面 -->
                <section id="screen-result" class="screen-panel hidden">
                    <div class="result-box">
                        <h2 id="result-title">どすこい大勝利！</h2>
                        <div class="winner-announcement" id="winner-name">東 エドモーンド の圧勝！</div>
                        
                        <div id="yokozuna-title-card" class="yokozuna-title-card hidden">
                            <div class="y-title" id="y-title-name">🚀 超音速神横綱</div>
                            <div class="y-desc" id="y-title-desc">全敵をぶっ飛ばして全勝制覇！</div>
                        </div>

                        <div class="result-actions-simplified">
                            <button id="btn-next-match" class="btn btn-arcade btn-main-next" type="button">
                                🔥 もう一回遊ぶ！ [Enter] ➔
                            </button>
                            <button id="btn-to-title" class="btn-sub-link" type="button">タイトルへ戻る (Esc)</button>
                        </div>
                    </div>
                </section>
            </div>

            <!-- 直感アクション操作パネル -->
            <div id="touch-controls" class="touch-controls-action">
                <div class="dpad-container">
                    <button id="dpad-up" class="dpad-btn dpad-u" type="button">⬆️</button>
                    <div class="dpad-row">
                        <button id="dpad-left" class="dpad-btn dpad-l" type="button">⬅️</button>
                        <span class="dpad-center">🕹️</span>
                        <button id="dpad-right" class="dpad-btn dpad-r" type="button">➡️</button>
                    </div>
                    <button id="dpad-down" class="dpad-btn dpad-d" type="button">⬇️</button>
                </div>

                <div class="control-group p1-controls">
                    <button id="btn-p1-push" class="action-btn push-btn" type="button">
                        <span class="action-emoji">💥</span>
                        <span class="action-label nowrap-label">インパクト（押す）</span>
                    </button>
                    <button id="btn-p1-dodge" class="action-btn dodge-btn" type="button">
                        <span class="action-emoji">✨</span>
                        <span class="action-label nowrap-label">パリィ（はたき）</span>
                    </button>
                    <button id="btn-p1-burst" class="action-btn burst-btn disabled" type="button" disabled>
                        <span class="action-emoji">🔥</span>
                        <span class="action-label nowrap-label">どすこい!</span>
                    </button>
                </div>
            </div>
        </main>

        <footer class="game-footer">
            <button id="btn-toggle-audio" class="audio-btn" type="button">🔊 Sound ON</button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
