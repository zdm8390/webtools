<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webtools Portal - オンラインゲーム＆便利ツール集</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;900&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fbf9f5;
            --card-bg: #fffdfa;
            --text-dark: #1c1917;
            --washi-navy: #1e1b4b;
            --washi-vermilion: #c2410c;
            --washi-gold: #b45309;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Shippori Mincho', serif;
            background-color: var(--bg-color);
            background-image: repeating-linear-gradient(45deg, rgba(180, 83, 9, 0.03) 0, rgba(180, 83, 9, 0.03) 12px, transparent 12px, transparent 24px);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }
        header {
            text-align: center;
            margin-bottom: 32px;
        }
        h1 {
            font-size: 2.2rem;
            color: var(--washi-navy);
            margin-bottom: 8px;
            font-weight: 900;
        }
        p.sub {
            font-family: 'Zen Maru Gothic', sans-serif;
            color: var(--washi-vermilion);
            font-size: 1rem;
            font-weight: 700;
        }
        .portal-grid {
            width: 100%;
            max-width: 800px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card-bg);
            border: 2.5px solid var(--washi-navy);
            border-radius: 18px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 6px 16px rgba(30, 27, 75, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 24px rgba(194, 65, 12, 0.2);
            border-color: var(--washi-vermilion);
        }
        .card-tag {
            display: inline-block;
            background: var(--washi-gold);
            color: #fff;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-family: 'Zen Maru Gothic', sans-serif;
            align-self: flex-start;
            font-weight: 900;
        }
        .card-title {
            font-size: 1.4rem;
            color: var(--washi-navy);
            font-weight: 900;
        }
        .card-desc {
            font-size: 0.9rem;
            color: #57534e;
            font-family: 'Zen Maru Gothic', sans-serif;
            line-height: 1.5;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <header>
        <h1>🏯 Webtools ゲームポータル</h1>
        <p class="sub">本格和風アクション・超音速スモウバトル公開中！</p>
    </header>

    <main class="portal-grid">
        <a href="sumo-battle/" class="card">
            <span class="card-tag">NEW 🔥 本格和風アクション</span>
            <h2 class="card-title">超音速スモウバトル ～ちゃんこ食わんかい～</h2>
            <p class="card-desc">360°全方向自由移動＆塩弾ジャストパリィ！主人公エドモーンドで敵の卑怯な塩飛び道具を打ち返し、全6ランク最速完走と最高称号『超音速神横綱』を目指せ！</p>
        </a>
    </main>
</body>
</html>
